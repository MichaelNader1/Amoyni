<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحفظة — Amoyni</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/youth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header class="app-header">
    <a href="dashboard.html" class="btn btn-icon btn-ghost" aria-label="رجوع">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="icon-mirror-rtl"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="brand">المحفظة</div>
    <span style="width:44px;"></span>
  </header>

  <main class="page-content">
    <div class="stats-grid grid-1" style="grid-template-columns: repeat(2,1fr);">
      <div class="stat-card"><div class="stat-value" id="stat-balance">0</div><div class="stat-label">الرصيد الحالي</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-earned">0</div><div class="stat-label">إجمالي المكتسب</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-donated">0</div><div class="stat-label">إجمالي التبرعات</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-received">0</div><div class="stat-label">إجمالي المستلم</div></div>
    </div>

    <div class="section-title mt-6">سجل الحركات</div>
    <div class="wallet-filters" id="wallet-filters">
      <button data-group="all" class="is-active">الكل</button>
      <button data-group="attendance">حضور</button>
      <button data-group="voucher">Voucher</button>
      <button data-group="referral">Referral</button>
      <button data-group="donations">تبرعات</button>
      <button data-group="additions">إضافات</button>
      <button data-group="deductions">خصومات</button>
    </div>

    <div id="transactions-list">
      <div class="skeleton skeleton-card mb-2"></div>
      <div class="skeleton skeleton-card mb-2"></div>
      <div class="skeleton skeleton-card mb-2"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>الرئيسية</a>
    <a href="wallet.html" class="is-active"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M2 10h20" stroke="currentColor" stroke-width="2"/></svg>المحفظة</a>
    <div class="fab"><a href="scanner.html" class="fab-btn"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 7V5a1 1 0 0 1 1-1h2M4 17v2a1 1 0 0 0 1 1h2M20 7V5a1 1 0 0 0-1-1h-2M20 17v2a1 1 0 0 1-1 1h-2M4 12h16" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></a></div>
    <a href="leaderboard.html"><svg viewBox="0 0 24 24" fill="none"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4zM7 6H4a2 2 0 0 0 2 4M17 6h3a2 2 0 0 1-2 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Leaderboard</a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>حسابي</a>
  </nav>

  <script src="assets/vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/wallet.js"></script>
</body>
</html>
