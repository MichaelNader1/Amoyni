<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voucher — Amoyni</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/youth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header class="app-header">
    <a href="dashboard.html" class="btn btn-icon btn-ghost" aria-label="رجوع">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="icon-mirror-rtl"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="brand">استخدام كود</div>
    <span style="width:44px;"></span>
  </header>

  <main class="page-content">
    <div id="redeem-view">
      <div class="card text-center">
        <div style="font-size:48px;">🎟️</div>
        <h2 class="mt-2">عندك كود؟</h2>
        <p class="text-sm text-muted mt-1">اكتب الكود وهتاخد نقط فورًا</p>
        <form id="voucher-form" class="mt-4">
          <div class="field" id="field-code">
            <input class="field-input voucher-input-row-input" style="text-align:center;letter-spacing:4px;font-weight:900;text-transform:uppercase;" type="text" id="voucher-code" placeholder="ABC123" maxlength="20" required>
            <div class="field-error-text"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="redeem-submit"><span class="btn-label">استخدام الكود</span></button>
        </form>
      </div>
    </div>

    <div id="success-view" class="text-center" style="display:none;">
      <div class="success-check"><svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="success-message">مبروك!</h2>
      <div class="points-counter mt-2" id="voucher-points">+0</div>
      <div class="text-sm text-muted mt-1">رصيدك الجديد: <span id="voucher-new-balance">0</span></div>
      <button class="btn btn-secondary btn-block mt-6" id="redeem-another">استخدام كود آخر</button>
    </div>
  </main>

  <script src="assets/vendor/confetti.browser.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/voucher.js"></script>
</body>
</html>
