<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول — Amoyni</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/youth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-logo">
        <div class="brand-mark-lg">A</div>
        <div class="brand-name">Amoyni</div>
        <div class="brand-tag">سجّل حضورك، اجمع نقاطك، وشارك في الطمبولة</div>
      </div>

      <form id="login-form" novalidate>
        <div class="field" id="field-phone">
          <label class="field-label" for="phone">رقم الهاتف</label>
          <input class="field-input" type="tel" id="phone" name="phone" placeholder="01xxxxxxxxx" inputmode="numeric" autocomplete="tel" required>
          <div class="field-error-text"></div>
        </div>

        <div class="field" id="field-password">
          <label class="field-label" for="password">كلمة المرور</label>
          <div class="field-with-icon">
            <input class="field-input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="field-icon" id="toggle-password" aria-label="إظهار كلمة المرور">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
          <div class="field-error-text"></div>
        </div>

        <label class="checkbox-row mb-4">
          <input type="checkbox" id="remember-me" checked>
          <span class="text-sm">ابقَ مسجلاً على هذا الجهاز</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit">
          <span class="btn-label">تسجيل الدخول</span>
        </button>
      </form>

      <div class="auth-switch">
        ليس لديك حساب؟ <a href="register.html">أنشئ حسابًا جديدًا</a>
      </div>
    </div>
  </div>

  <script src="assets/vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
