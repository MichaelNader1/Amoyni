<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرئيسية — Amoyni</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/youth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" style="padding:0;overflow:hidden;"><img src="assets/images/logo/amoyni-logo.png" alt="Amoyni" style="width:100%;height:100%;object-fit:cover;"></span> Amoyni</div>
    <a href="profile.html" id="header-avatar-link"><div class="avatar avatar-sm" id="header-avatar"></div></a>
  </header>

  <main class="page-content">
    <div class="dashboard-layout">
      <div>
        <div class="hero-card">
          <div class="hero-greeting" id="greeting-text">أهلاً بيك 👋</div>
          <div class="hero-name" id="user-name">—</div>
          <div class="hero-balance-row">
            <div class="hero-balance-label">رصيدك</div>
            <div class="hero-balance" id="balance-value">0</div>
          </div>
          <div class="flex items-center gap-2 mt-3">
            <span class="streak-pill"><span class="streak-flame">🔥</span> <span id="streak-value">0</span> اجتماعات متتالية</span>
          </div>
          <div class="hero-actions">
            <a href="scanner.html" class="btn btn-gold btn-lg w-full">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7V5a1 1 0 0 1 1-1h2M4 17v2a1 1 0 0 0 1 1h2M20 7V5a1 1 0 0 0-1-1h-2M20 17v2a1 1 0 0 1-1 1h-2M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              امسح QR وسجّل حضورك
            </a>
          </div>
        </div>

        <div id="spotlight-section" style="display:none;" class="mt-4"></div>
        <div class="card mt-4" id="no-meeting-section">
          <div class="state-block" style="padding: var(--space-4) 0;">
            <div class="state-title" style="font-size:var(--fs-md);">لا يوجد اجتماع نشط حاليًا</div>
            <div class="text-sm">هيتم إعلامك هنا لما يبدأ الاجتماع القادم</div>
          </div>
        </div>

        <div class="section-title mt-6">روابط سريعة</div>
        <div class="quick-links-grid">
          <a href="wallet.html" class="quick-link-card"><span class="quick-link-icon">💳</span> المحفظة</a>
          <a href="voucher.html" class="quick-link-card"><span class="quick-link-icon">🎟️</span> Voucher</a>
          <a href="leaderboard.html" class="quick-link-card"><span class="quick-link-icon">🏆</span> Leaderboard</a>
          <a href="donations.html" class="quick-link-card"><span class="quick-link-icon">❤️</span> التبرعات</a>
          <a href="attendance-history.html" class="quick-link-card"><span class="quick-link-icon">📅</span> سجل الحضور</a>
          <a href="profile.html" class="quick-link-card"><span class="quick-link-icon">👤</span> الملف الشخصي</a>
        </div>
      </div>

      <div>
        <div class="card mt-6" style="margin-top:0;">
          <div class="section-title">آخر العمليات</div>
          <div id="recent-activity-list">
            <div class="skeleton skeleton-card mb-2"></div>
            <div class="skeleton skeleton-card mb-2"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="is-active">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      الرئيسية
    </a>
    <a href="wallet.html">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M2 10h20" stroke="currentColor" stroke-width="2"/></svg>
      المحفظة
    </a>
    <div class="fab">
      <a href="scanner.html" class="fab-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 7V5a1 1 0 0 1 1-1h2M4 17v2a1 1 0 0 0 1 1h2M20 7V5a1 1 0 0 0-1-1h-2M20 17v2a1 1 0 0 1-1 1h-2M4 12h16" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
    </div>
    <a href="leaderboard.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4zM7 6H4a2 2 0 0 0 2 4M17 6h3a2 2 0 0 1-2 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Leaderboard
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      حسابي
    </a>
  </nav>

  <script src="assets/vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
