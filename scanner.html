<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسح الحضور — Amoyni</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/youth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header class="app-header">
    <a href="dashboard.html" class="btn btn-icon btn-ghost" aria-label="رجوع">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="icon-mirror-rtl"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="brand">تسجيل الحضور</div>
    <span style="width:44px;"></span>
  </header>

  <main class="page-content">
    <!-- SCAN VIEW -->
    <div id="scan-view" class="scanner-shell">
      <div id="camera-panel">
        <div class="scanner-viewport">
          <div id="qr-reader"></div>
          <div class="scanner-frame"><div class="scan-line"></div></div>
        </div>
        <p class="text-center text-sm text-muted mt-4">وجّه الكاميرا نحو كود الـQR المعروض في الاجتماع</p>
      </div>

      <div id="scan-status" class="card mt-4" style="display:none;"></div>
    </div>

    <!-- SUCCESS VIEW (hidden until attendance is confirmed) -->
    <div id="success-view" class="success-shell" style="display:none;">
      <div class="success-check">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>تم تسجيل حضورك بنجاح 🎉</h2>
      <div class="mt-4">
        <div class="text-sm text-muted">النقاط المكتسبة</div>
        <div class="points-counter" id="points-awarded">+0</div>
        <div class="text-sm text-muted mt-1">رصيدك الجديد: <span id="new-balance">0</span></div>
        <div class="streak-pill mt-3"><span class="streak-flame">🔥</span> <span id="new-streak">0</span> اجتماعات متتالية</div>
      </div>

      <div id="raffle-block" class="raffle-card" style="display:none;">
        <div class="text-sm">رقم الطمبولة الخاص بيك</div>
        <div class="raffle-number" id="raffle-number">—</div>
      </div>
      <div id="raffle-exhausted-note" class="badge badge-warning mt-3" style="display:none;">تم تسجيل حضورك، لكن أرقام الطمبولة انتهت</div>

      <div id="content-block" class="verse-card mt-4" style="display:none;"></div>

      <a href="dashboard.html" class="btn btn-primary btn-block btn-lg mt-6">العودة للرئيسية</a>
    </div>
  </main>

  <script src="assets/vendor/html5-qrcode.min.js"></script>
  <script src="assets/vendor/confetti.browser.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/scanner.js"></script>
</body>
</html>
