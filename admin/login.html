<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دخول المسؤول — Amoyni</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/youth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-logo">
        <div class="brand-mark-lg" style="background:none;box-shadow:none;padding:0;"><img src="../assets/images/logo/amoyni-logo.png" alt="Amoyni" style="width:100%;height:100%;object-fit:contain;"></div>
        <div class="brand-name">لوحة تحكم Amoyni</div>
        <div class="brand-tag">دخول المسؤولين فقط</div>
      </div>

      <form id="admin-login-form" novalidate>
        <div class="field" id="field-username">
          <label class="field-label" for="username">اسم المستخدم</label>
          <input class="field-input" type="text" id="username" autocomplete="username" required>
          <div class="field-error-text"></div>
        </div>
        <div class="field" id="field-password">
          <label class="field-label" for="password">كلمة المرور</label>
          <input class="field-input" type="password" id="password" autocomplete="current-password" required>
          <div class="field-error-text"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="admin-login-submit">
          <span class="btn-label">دخول</span>
        </button>
      </form>
    </div>
  </div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    (function () {
      window.AmoyniSession.redirectIfAdminLoggedIn("index.html");
      const form = document.getElementById("admin-login-form");
      const submitBtn = document.getElementById("admin-login-submit");
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        window.AmoyniValidate.clearAllErrors(form);
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (!username || !password) {
          window.AmoyniUI.toast("الرجاء إدخال اسم المستخدم وكلمة المرور", "error");
          return;
        }
        window.AmoyniUI.setButtonLoading(submitBtn, true);
        try {
          const data = await window.AmoyniAPI.call("admin_login", { p_username: username, p_password: password });
          window.AmoyniSession.setAdmin(data, true);
          window.location.href = "index.html";
        } catch (err) {
          window.AmoyniUI.toast(window.AmoyniUI.friendlyError(err), "error");
        } finally {
          window.AmoyniUI.setButtonLoading(submitBtn, false);
        }
      });
    })();
  </script>
</body>
</html>
