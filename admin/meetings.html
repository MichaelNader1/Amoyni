<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الاجتماعات — Amoyni Admin</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/youth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="main-with-sidebar">
      <div class="admin-topbar">
        <button class="btn btn-icon btn-ghost sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <div class="admin-page-title" id="admin-page-title"></div>
        <a href="meeting-create.html" class="btn btn-primary btn-sm">+ اجتماع جديد</a>
      </div>
      <main class="page-content">
        <div class="filter-bar">
          <select class="field-select" id="status-filter" style="max-width:200px;">
            <option value="">كل الحالات</option>
            <option value="draft">Draft</option>
            <option value="active">Active</option>
            <option value="closed">Closed</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <table class="responsive-table" id="meetings-table">
          <thead><tr><th>الاجتماع</th><th>التاريخ</th><th>الحالة</th><th>الحضور</th><th>النقاط الموزعة</th><th></th></tr></thead>
          <tbody id="meetings-tbody">
            <tr><td colspan="6"><div class="skeleton skeleton-text"></div></td></tr>
          </tbody>
        </table>
      </main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin/nav.js"></script>
  <script src="../assets/js/admin/meetings.js"></script>
</body>
</html>
