<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النقاط — Amoyni Admin</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/youth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="main-with-sidebar">
      <div class="admin-topbar">
        <button class="btn btn-icon btn-ghost sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <div class="admin-page-title" id="admin-page-title"></div>
        <span style="width:44px;"></span>
      </div>
      <main class="page-content" style="max-width:640px;">
        <div class="card">
          <div class="section-title">إضافة أو خصم نقاط</div>
          <div class="field">
            <label class="field-label">ابحث عن شاب</label>
            <input class="field-input" id="user-search" placeholder="اكتب الاسم أو الهاتف">
            <div id="search-results" class="mt-2"></div>
          </div>

          <div id="selected-user-block" style="display:none;">
            <div class="card-elevated card mb-3" id="selected-user-card"></div>
            <form id="adjust-form">
              <div class="grid-1 sm-cols-2">
                <div class="field">
                  <label class="field-label">النوع</label>
                  <select class="field-select" id="adjust-direction">
                    <option value="credit">إضافة</option>
                    <option value="debit">خصم</option>
                  </select>
                </div>
                <div class="field">
                  <label class="field-label">عدد النقاط</label>
                  <input class="field-input" type="number" min="1" id="adjust-amount">
                </div>
              </div>
              <div class="field">
                <label class="field-label">السبب (إجباري)</label>
                <input class="field-input" id="adjust-reason" placeholder="مثال: مكافأة تشجيعية">
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="adjust-submit"><span class="btn-label">تنفيذ</span></button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin/nav.js"></script>
  <script src="../assets/js/admin/points.js"></script>
</body>
</html>
