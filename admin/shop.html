<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر النقاط — Amoyni Admin</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/youth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="main-with-sidebar">
      <div class="admin-topbar">
        <button class="btn btn-icon btn-ghost sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <div class="admin-page-title" id="admin-page-title"></div>
        <button class="btn btn-primary btn-sm" id="new-product-btn">+ منتج جديد</button>
      </div>
      <main class="page-content">
        <div class="tab-strip" id="shop-tabs">
          <button data-tab="products" class="is-active">المنتجات</button>
          <button data-tab="purchases">سجل المشتريات</button>
        </div>

        <div id="tab-products">
          <table class="responsive-table">
            <thead><tr><th>الصورة</th><th>الاسم</th><th>السعر</th><th>الكمية</th><th>الحالة</th><th>الحد الأقصى</th><th></th></tr></thead>
            <tbody id="products-tbody"><tr><td colspan="7"><div class="skeleton skeleton-text"></div></td></tr></tbody>
          </table>
        </div>

        <div id="tab-purchases" style="display:none;">
          <table class="responsive-table">
            <thead><tr><th>الشاب</th><th>المنتج</th><th>النقاط</th><th>التاريخ</th><th>التسليم</th></tr></thead>
            <tbody id="purchases-tbody"><tr><td colspan="5"><div class="skeleton skeleton-text"></div></td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/shop-core.js"></script>
  <script src="../assets/js/admin/nav.js"></script>
  <script src="../assets/js/admin/shop.js"></script>
</body>
</html>
