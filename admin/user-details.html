<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفاصيل الشاب — Amoyni Admin</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/youth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="main-with-sidebar">
      <div class="admin-topbar">
        <button class="btn btn-icon btn-ghost sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <div class="admin-page-title" id="admin-page-title"></div>
        <span style="width:44px;"></span>
      </div>
      <main class="page-content">
        <div class="grid-1 lg-cols-2">
          <div>
            <div class="card mb-4" id="user-summary"><div class="skeleton skeleton-text w-60"></div></div>

            <form class="card mb-4" id="edit-user-form">
              <div class="section-title">تعديل البيانات</div>
              <div class="field"><label class="field-label">الاسم الكامل</label><input class="field-input" id="edit-full_name"></div>
              <div class="field"><label class="field-label">الهاتف</label><input class="field-input" id="edit-phone"></div>
              <div class="field"><label class="field-label">تاريخ الميلاد</label><input type="date" class="field-input" id="edit-birth_date"></div>
              <div class="field">
                <label class="field-label">الصف</label>
                <select class="field-select" id="edit-grade">
                  <option value="أولى ثانوي">أولى ثانوي</option>
                  <option value="ثانية ثانوي">ثانية ثانوي</option>
                  <option value="ثالثة ثانوي">ثالثة ثانوي</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="save-user-btn"><span class="btn-label">حفظ</span></button>
            </form>

            <div class="card mb-4">
              <div class="section-title">إجراءات</div>
              <div class="flex flex-col gap-2">
                <button class="btn btn-secondary btn-block" id="reset-password-btn">تغيير كلمة المرور</button>
                <button class="btn btn-danger btn-block" id="toggle-status-btn"><span class="btn-label">تعطيل الحساب</span></button>
              </div>
            </div>
          </div>

          <div>
            <div class="card mb-4">
              <div class="section-title">المحفظة</div>
              <div id="wallet-summary"><div class="skeleton skeleton-text"></div></div>
            </div>
            <div class="card">
              <div class="section-title">سجل الحضور</div>
              <div id="attendance-list"><div class="skeleton skeleton-text"></div></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin/nav.js"></script>
  <script src="../assets/js/admin/user-details.js"></script>
</body>
</html>
