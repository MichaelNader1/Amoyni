<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفاصيل الاجتماع — Amoyni Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/youth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="main-with-sidebar">
      <div class="admin-topbar">
        <button class="btn btn-icon btn-ghost sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <div class="admin-page-title" id="admin-page-title"></div>
        <span style="width:44px;"></span>
      </div>
      <main class="page-content">
        <div id="meeting-header" class="card mb-4">
          <div class="skeleton skeleton-text w-60"></div>
        </div>

        <div id="qr-section" class="card qr-display-card mb-4" style="display:none;">
          <div class="section-title">كود الحضور (QR)</div>
          <canvas id="qr-canvas"></canvas>
          <p class="text-sm text-muted mt-3">اعرض الكود ده على شاشة في مكان الاجتماع عشان الشباب يمسحوه</p>
        </div>

        <div class="card mb-4" id="rules-card">
          <div class="flex justify-between items-center mb-3">
            <div class="section-title" style="margin:0;">شرائح نقاط الحضور</div>
          </div>
          <div id="rules-list"></div>
          <div id="add-rule-form" class="mt-3">
            <div class="point-rule-row">
              <div class="field" style="margin:0;"><label class="field-label">من</label><input type="datetime-local" class="field-input" id="rule-start"></div>
              <div class="field" style="margin:0;"><label class="field-label">إلى</label><input type="datetime-local" class="field-input" id="rule-end"></div>
              <div class="field" style="margin:0;"><label class="field-label">النقاط</label><input type="number" min="0" class="field-input" id="rule-points" value="10"></div>
              <button class="btn btn-primary btn-icon" id="add-rule-btn" title="إضافة">+</button>
            </div>
          </div>
          <div id="rules-locked-note" class="text-sm text-muted" style="display:none;">لا يمكن تعديل الشرائح بعد بدء الاجتماع</div>
        </div>

        <div class="card mb-4">
          <div class="flex gap-3 flex-col sm-row">
            <button class="btn btn-gold btn-block" id="start-meeting-btn" style="display:none;">🚀 بدء الاجتماع وتفعيل QR</button>
            <button class="btn btn-danger btn-block" id="close-meeting-btn" style="display:none;">إغلاق الاجتماع</button>
          </div>
        </div>

        <div class="card">
          <div class="flex justify-between items-center mb-3">
            <div class="section-title" style="margin:0;">قائمة الحضور</div>
            <button class="btn btn-secondary btn-sm" id="export-attendance-btn">تصدير CSV</button>
          </div>
          <table class="responsive-table">
            <thead><tr><th>الاسم</th><th>الهاتف</th><th>الصف</th><th>الوقت</th><th>النقاط</th><th>الطمبولة</th></tr></thead>
            <tbody id="attendance-tbody"><tr><td colspan="6"><div class="skeleton skeleton-text"></div></td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <script src="../assets/vendor/qrcode-generator.js"></script>
  <script src="../assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin/nav.js"></script>
  <script src="../assets/js/admin/meeting-details.js"></script>
</body>
</html>
