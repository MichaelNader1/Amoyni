<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشباب — Amoyni Admin</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/youth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="main-with-sidebar">
      <div class="admin-topbar">
        <button class="btn btn-icon btn-ghost sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <div class="admin-page-title" id="admin-page-title"></div>
        <span style="width:44px;"></span>
      </div>
      <main class="page-content">
        <div class="filter-bar">
          <input class="field-input" id="search-input" placeholder="ابحث بالاسم أو الهاتف" style="flex:1;min-width:200px;">
          <select class="field-select" id="grade-filter">
            <option value="">كل الصفوف</option>
            <option value="أولى ثانوي">أولى ثانوي</option>
            <option value="ثانية ثانوي">ثانية ثانوي</option>
            <option value="ثالثة ثانوي">ثالثة ثانوي</option>
          </select>
          <select class="field-select" id="status-filter">
            <option value="">كل الحالات</option>
            <option value="active">نشط</option>
            <option value="disabled">معطل</option>
          </select>
        </div>
        <table class="responsive-table">
          <thead><tr><th>الاسم</th><th>الهاتف</th><th>الصف</th><th>الرصيد</th><th>Streak</th><th>الحالة</th><th></th></tr></thead>
          <tbody id="users-tbody"><tr><td colspan="7"><div class="skeleton skeleton-text"></div></td></tr></tbody>
        </table>
      </main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <script src="../assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin/nav.js"></script>
  <script src="../assets/js/admin/users.js"></script>
</body>
</html>
